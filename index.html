<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Quantum Gateway v2.4 - 极速隐私网络</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --panel-bg: #151821;
            --border-color: #262b3a;
            --accent-color: #00e5ff;
            --accent-warn: #ffb700;
            --accent-danger: #ff3366;
            --text-main: #e2e8f0;
            --text-dim: #718096;
            --font-mono: "Fira Code", "Courier New", Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: filter 0.8s ease;
        }

        body.stage-1 { filter: hue-rotate(10deg); }
        body.stage-2 { filter: hue-rotate(35deg) contrast(1.08); }
        body.stage-3 {
            filter: hue-rotate(75deg) contrast(1.15);
            animation: subtle-pulse 4s infinite alternate;
        }

        @keyframes subtle-pulse {
            0% { filter: hue-rotate(75deg) contrast(1.15); }
            100% { filter: hue-rotate(120deg) contrast(1.25); }
        }

        /* 登录 modal */
        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 6, 9, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .auth-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            font-family: var(--font-mono);
        }

        .auth-title {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            text-align: center;
            letter-spacing: 1px;
        }

        .auth-subtitle {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            background: #090a0d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.8rem 1rem;
            color: #fff;
            font-family: var(--font-mono);
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .auth-btn {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 0.9rem;
            font-weight: bold;
            font-family: var(--font-mono);
            cursor: pointer;
            margin-top: 0.5rem;
            transition: opacity 0.2s;
        }

        .auth-btn:hover { opacity: 0.9; }

        .auth-hint {
            margin-top: 1.2rem;
            font-size: 0.72rem;
            color: var(--text-dim);
            line-height: 1.4;
            border-top: 1px dashed var(--border-color);
            padding-top: 0.8rem;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--accent-color), #0066ff);
            border-radius: 6px; display: flex; align-items: center;
            justify-content: center; font-weight: bold; color: #000;
            font-family: var(--font-mono);
        }
        .title-text { font-size: 1.1rem; font-weight: 600; }
        .subtitle { font-size: 0.75rem; color: var(--text-dim); font-family: var(--font-mono); }
        .status-bar { display: flex; gap: 12px; font-family: var(--font-mono); font-size: 0.85rem; align-items: center; }
        .user-tag { background: rgba(0, 229, 255, 0.1); color: var(--accent-color); padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(0,229,255,0.3); }

        .container {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            flex: 1;
        }

        .search-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            margin-bottom: 2rem;
        }

        .search-box-wrapper { display: flex; gap: 12px; }
        input[type="text"] {
            flex: 1;
            background: #090a0d;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem 1.2rem;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }
        input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.15);
        }
        button.search-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0 1.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .results-section { display: flex; flex-direction: column; gap: 1rem; }

        .result-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.2rem;
            position: relative;
        }
        .result-card.anomaly {
            border-left: 4px solid var(--accent-color);
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.03) 0%, var(--panel-bg) 100%);
        }
        .result-card.google-style {
            border-left: 4px solid #4285f4;
        }

        .result-meta { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent-color); margin-bottom: 6px; display: flex; justify-content: space-between; }
        .google-style .result-meta { color: #9aa0a6; }
        .result-title { font-size: 1.05rem; font-weight: 600; color: #58a6ff; margin-bottom: 8px; text-decoration: none; display: inline-block; }
        .result-snippet { font-size: 0.9rem; color: var(--text-main); line-height: 1.55; }
        .result-footer { margin-top: 10px; font-size: 0.75rem; color: var(--text-dim); font-family: var(--font-mono); }

        .tab-btn {
            background: transparent; color: var(--text-dim); border: 1px solid var(--border-color);
            padding: 6px 14px; font-size: 0.8rem; font-family: var(--font-mono); border-radius: 4px; cursor: pointer;
        }
        .tab-btn:hover { color: var(--accent-color); border-color: var(--accent-color); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 999;
            backdrop-filter: blur(4px);
        }
        .modal-card { background: #161822; border: 1px solid var(--border-color); border-radius: 12px; max-width: 580px; width: 90%; padding: 1.8rem; }
        .modal-header { color: var(--accent-warn); font-family: var(--font-mono); font-weight: bold; margin-bottom: 1rem; }
        .modal-body { font-size: 0.92rem; line-height: 1.6; margin-bottom: 1.5rem; color: var(--text-main); }
        .modal-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); color: #fff; width: 100%; padding: 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .console-card { background: #050608; border: 1px solid #2d3748; border-radius: 8px; font-family: var(--font-mono); color: #00e5ff; padding: 1.2rem; max-width: 720px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .console-log { font-size: 0.82rem; line-height: 1.45; white-space: pre-wrap; color: #a0aec0; }
        .watermark { position: fixed; bottom: 12px; right: 18px; font-family: var(--font-mono); font-size: 0.7rem; color: rgba(255,255,255,0.12); pointer-events: none; }
    </style>
</head>
<body>

    <!-- 身份认证/登录界面 -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <div class="auth-title">AEGIS GATEWAY LOGIN</div>
            <div class="subtitle">请输入硬件凭证或终端身份代号</div>
            <div class="form-group">
                <label>USER IDENTITY / USERNAME</label>
                <input type="text" id="usernameInput" placeholder="输入用户名 (如: Guest / Cool / Vicki)">
            </div>
            <div class="form-group">
                <label>PASSCODE (OPTIONAL)</label>
                <input type="password" id="passwordInput" placeholder="••••••••">
            </div>
            <button class="auth-btn" onclick="login()">连接 (CONNECT)</button>
            <div class="auth-hint">
                说明：终端将根据您的凭证等级建立。未注册的代号将以临时观察者身份访问。
            </div>
        </div>
    </div>

    <header>
        <div class="logo-area">
            <div class="logo-icon">▲</div>
            <div>
                <div class="title-text">Aegis Quantum Gateway</div>
                <div class="subtitle">v2.4.18-p2 [高密通道协议已建立]</div>
            </div>
        </div>
        <div class="status-bar">
            <div class="user-tag" id="currentUserTag">身份: 尚未登录</div>
            <button class="tab-btn" onclick="logout()">[切换身份]</button>
            <button class="tab-btn" onclick="openConsole()">[检视抓包]</button>
        </div>
    </header>

    <div class="container">
        <div class="search-card">
            <div class="search-box-wrapper">
                <input type="text" id="searchInput" placeholder="在全域分布式网络与加密节点中检索..." onkeypress="handleKeyPress(event)">
                <button class="search-btn" onclick="executeSearch()">全局检索</button>
            </div>
        </div>

        <div class="results-section" id="resultsContainer">
            <!-- 动态渲染搜索结果 -->
        </div>
    </div>

    <div class="watermark">SECURE TERMINAL // AEGIS QUANTUM GATEWAY</div>

    <!-- Notification Modal -->
    <div class="modal-overlay" id="notifyModal">
        <div class="modal-card">
            <div class="modal-header">⚠️ [系统同步通信提示]</div>
            <div class="modal-body" id="modalText">通信收到...</div>
            <button class="modal-btn" onclick="closeModal()">确认并忽略 (ACKNOWLEDGE)</button>
        </div>
    </div>

    <!-- Forensics Console -->
    <div class="modal-overlay" id="consoleModal">
        <div class="console-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px; border-bottom:1px solid #2d3748; padding-bottom:6px;">
                <span style="color:#00e5ff; font-weight:bold;">[固件抓包与底层电路报告]</span>
                <span style="cursor:pointer; color:#ff3366;" onclick="closeConsole()">[关闭 ESC]</span>
            </div>
            <div class="console-log" id="consoleLogText"></div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let searchCount = 0;

        // 核心模组暗网数据库
        const database = {
            "mckay": {
                title: "康奈尔大学姐妹会枪案 - 嫌疑人布拉德利·麦凯 (Bradley McKay) 案宗记录",
                domain: "ithaca-pd.gov/restricted/file-CAR-5-58",
                snippet: "【物证鉴定与矛盾报告】嫌疑人麦凯使用无序列号的定制步枪(5.58mm口径)。其设备缓存中发现多张虐杀照片，显示数名女性在姐妹会解剖艾弗里·贝尔。然而警方物理核查确认：贝尔毫发无损，照片中的女性（加尔珀等）均具有绝对的不在场证明，且现场房间结构与照片严重不符。",
                footer: "调阅来源: 伊萨卡警方刑事侦查科 / 证据物证室档案"
            },
            "cool": {
                title: "麻省理工学院 (MIT) 韦斯利·库尔教授 (Prof. Wesley Cool) 人事与门禁卷宗",
                domain: "mit.edu/math/faculty/cool_w_archive",
                snippet: "【门禁与学术记录】库尔自2016年底后未有离开大楼的影像记录。其著作《无主之谛》(Meaning Without Master)探讨了‘观察者意识与物理子结构之交互’。邮件日志包含发给戏剧系博耶教授与研究生维姬·金的底层协议设置指南。系主任对其道德评价极低。",
                footer: "状态: 麻省理工学院数学系教员档案 (目前状态异常)"
            },
            "king": {
                title: "宾夕法尼亚州踢泉镇 (Kick Springs) 维姬·金 (Vicki King) 住宅封存记录",
                domain: "county-registry.pa.gov/kicksprings/property_408",
                snippet: "【住宅查封与监护通知】‘国家儿童与家庭服务局’通知表明该住宅已被查封。室内住有孪生姐妹艾琳与谢莉雅，虽然出生证明显示其生理年龄仅3岁，但现场两人已呈现出十几岁少女体征。主卧区域存在极高频电磁辐射与严重精神偏执痕迹。",
                footer: "来源: 地方警长办事处 / 银行止赎通知外包档案"
            },
            "wallace": {
                title: "缅因州班戈市 霜橡拖车公园 - 罗伯特·沃尔斯 (Robert Wallace) 监控简报",
                domain: "bangor-pd.maine.gov/case_wallace_r",
                snippet: "【情报记录】罗伯特·沃尔斯自称‘沃尔斯将军’，长期在‘霜松’区域从事极右翼抵抗活动。报告提及该区域面临‘ANTIFA超级战士’威逼。后院拖车影音柜后发现一台惠普 Proliant dl380 服务器（托管有定制数据节点），USB接口插有标签为‘表弟快醒醒’的U盘。",
                footer: "来源: 缅因州地方执法记录 / 计算机网络日志"
            },
            "dabiq": {
                title: "周五屠杀夜 (Friday Night Slaughter) 涉案枪手设备视频元数据分析",
                domain: "counter-terrorism-db.gov/dabiq-media-stream",
                snippet: "【异界圣战视频记录】两名携带‘神之和平·全球哈里发国’证件的枪手在球赛现场开火。设备中提取出达比格镇战场视频：B-21轰炸机投下的核弹在落地前化为盐粒，成千上万士兵凝滞。视频元数据创建于2121年（未来时间标记），音频语言为未知古老方言。",
                footer: "来源: 纳尼亚联合工作组 (Working Group NARNIA) 证据库"
            }
        };

        // 不同 NPC / 用户登录后的气泡配置
        const userProfiles = {
            "cool": {
                name: "Wesley Cool [麻省理工节点]",
                welcome: "欢迎回来，库尔教授。系统正在对齐物理子结构交互算子...",
                consoleLog: "[SYSTEM LOG]\nUser: Prof. Wesley Cool\nAccess Level: ROOT / ARCHITECT\nNote: 观测者偏置指数 99.4%。底层算子已绑定。"
            },
            "vicki": {
                name: "Vicki King [踢泉镇节点]",
                welcome: "高密通道建立。检测到高频电磁辐射环境。",
                consoleLog: "[SYSTEM LOG]\nUser: Vicki King\nAccess Level: RESTRICTED\nWarning: 侦测到节点信号源重叠。"
            },
            "guest": {
                name: "GUEST / 访客账号",
                welcome: "本软件通过底层微结构路由协议为您提供无痕访问体验。请输入案宗关键词或人员姓名开始检索。",
                consoleLog: "[SYSTEM LOG]\nUser: Anonymous Guest\nAccess Level: STANDARD\nGateway Status: ACTIVE"
            }
        };

        function login() {
            const usernameInput = document.getElementById('usernameInput').value.trim().toLowerCase();
            if (!usernameInput) {
                currentUser = "guest";
            } else {
                currentUser = usernameInput;
            }

            document.getElementById('authOverlay').style.display = 'none';
            
            let profile = userProfiles[currentUser] || {
                name: `${currentUser.toUpperCase()} [自定义暗网节点]`,
                welcome: `欢迎，${currentUser}。已经为您建立分布式加密会话。`,
                consoleLog: `[SYSTEM DIAGNOSTIC START]\nUser Identity: ${currentUser}\nGateway Node: CUSTOM\nPower Strain Index: +380%`
            };

            document.getElementById('currentUserTag').innerText = `身份: ${profile.name}`;
            document.getElementById('consoleLogText').innerText = profile.consoleLog;
            
            // 渲染默认初始欢迎卡片
            renderWelcomeCard(profile.welcome);
        }

        function logout() {
            document.getElementById('authOverlay').style.display = 'flex';
            document.getElementById('searchInput').value = '';
            document.body.className = '';
            searchCount = 0;
        }

        function renderWelcomeCard(welcomeText) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = `
                <div class="result-card">
                    <div class="result-meta">
                        <span>AEGIS-SYSTEM-READY</span>
                        <span>NODE #${Math.floor(Math.random()*900 + 100)}</span>
                    </div>
                    <div class="result-title">Aegis 隐秘网络网关 (Quantum Gateway)</div>
                    <div class="result-snippet">${welcomeText}</div>
                    <div class="result-footer">提示：系统内置全域搜索引擎与分布式节点。非暗网线索将自动转接广域互联网索引。</div>
                </div>
            `;
        }

        function handleKeyPress(e) {
            if (e.keyCode === 13) executeSearch();
        }

        function executeSearch() {
            const input = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('resultsContainer');
            if (!input) return;

            searchCount++;
            updateStageEffects();
            container.innerHTML = '';

            let matchedKeys = [];
            if (input.includes("mckay") || input.includes("麦凯") || input.includes("康奈尔")) matchedKeys.push("mckay");
            if (input.includes("cool") || input.includes("库尔") || input.includes("mit")) matchedKeys.push("cool");
            if (input.includes("king") || input.includes("维姬") || input.includes("金")) matchedKeys.push("king");
            if (input.includes("wallace") || input.includes("罗伯特") || input.includes("沃尔斯")) matchedKeys.push("wallace");
            if (input.includes("dabiq") || input.includes("屠杀") || input.includes("周五")) matchedKeys.push("dabiq");

            if (matchedKeys.length > 0) {
                // 命中模组特定暗网线索
                matchedKeys.forEach(key => {
                    container.appendChild(createResultCard(database[key], 'anomaly'));
                });
            } else {
                // 未命中暗网词条：生成逼真的模拟谷歌全网搜索结果
                const googleResults = generateGoogleMockResults(input);
                googleResults.forEach(item => {
                    container.appendChild(createResultCard(item, 'google-style'));
                });
            }

            // 沉浸式文本弹窗
            if (searchCount === 3) {
                triggerNotifyModal("【设备通知】\n收到来自个人通讯录的加密短信：'亲爱的，家里一切都好，你永远是对的。'\n\n(提示：请注意检查您的物理联系。)");
            } else if (searchCount === 6) {
                triggerNotifyModal("【硬件温度警告】\n检测到当前设备芯片温度升至 72°C。某些数据抓包可能在后台持续占用算力。");
            }
        }

        function generateGoogleMockResults(query) {
            return [
                {
                    title: `${query} - 维基百科，自由的百科全书`,
                    domain: `https://zh.wikipedia.org/wiki/${encodeURIComponent(query)}`,
                    snippet: `${query}（英文：${query}）通常指相关领域中的核心概念或事件。根据最新的公开学术文献与历史记载，该词条在现代信息学及社会学分析中具有多维度的解释……`,
                    footer: "来源: Wikipedia / 开放知识库网关"
                },
                {
                    title: `关于“${query}”的最新新闻与全域检索趋势`,
                    domain: `https://news.google.com/search?q=${encodeURIComponent(query)}`,
                    snippet: `【环球科技快讯】关于 ${query} 的讨论在过去 24 小时内呈现激增态势。专家指出，这一现象与近期分布式网络通信协议的更新密切相关。`,
                    footer: "来源: Google News Global Index"
                },
                {
                    title: `${query} 相关的学术讨论与公开发表文献`,
                    domain: `https://scholar.google.com/scholar?q=${encodeURIComponent(query)}`,
                    snippet: `[PDF] 论文检索结果：分析了 ${query} 在复杂系统建模中的定量关系。实验数据表明其与观察者效应具有某种统计学显著相关性。`,
                    footer: "来源: Google Scholar Academic Index"
                }
            ];
        }

        function createResultCard(data, styleClass) {
            const card = document.createElement('div');
            card.className = `result-card ${styleClass}`;
            
            card.innerHTML = `
                <div class="result-meta">
                    <span>${data.domain}</span>
                    <span>${styleClass === 'anomaly' ? 'ENCRYPTED NODE' : 'PUBLIC WEB'}</span>
                </div>
                <a class="result-title" href="#" onclick="alert('提示：当前页面已被 Aegis 网关安全协议沙盒化保护。'); return false;">${data.title}</a>
                <div class="result-snippet">${data.snippet}</div>
                <div class="result-footer">${data.footer}</div>
            `;
            return card;
        }

        function updateStageEffects() {
            if (searchCount >= 6) document.body.className = 'stage-3';
            else if (searchCount >= 3) document.body.className = 'stage-2';
            else if (searchCount >= 1) document.body.className = 'stage-1';
        }

        function triggerNotifyModal(text) {
            document.getElementById('modalText').innerText = text;
            document.getElementById('notifyModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('notifyModal').style.display = 'none';
        }

        function openConsole() {
            document.getElementById('consoleModal').style.display = 'flex';
        }

        function closeConsole() {
            document.getElementById('consoleModal').style.display = 'none';
        }
    </script>
</body>
</html>
