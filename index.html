<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL ACCESS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #0b0e14; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <!-- 模拟加密隧道解密跳转动画 -->
    <div class="loader-overlay" id="loaderOverlay" style="display: none;">
        <div class="spinner"></div>
        <div id="loaderStatusText">正在解密数据流...</div>
    </div>

    <!-- 极简硬件凭证登录面板（默认正常显示，防止黑屏） -->
    <div class="auth-overlay" id="authOverlay" style="display: flex; width: 100%; height: 100vh; justify-content: center; align-items: center; background: #0b0e14; position: fixed; top: 0; left: 0; z-index: 9999;">
        <div class="auth-card" style="width: 360px; background: #12161f; border: 1px solid #1a2332; border-radius: 8px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
            
            <div style="font-size: 13px; color: #8a99ad; margin-bottom: 20px; font-family: monospace;">
                请输入硬件凭证或终端身份代号
            </div>
            
            <div class="form-group" style="margin-bottom: 18px;">
                <label style="display: block; font-size: 11px; color: #5c6b73; font-family: monospace; letter-spacing: 1px; margin-bottom: 8px;">USERNAME / USER IDENTITY</label>
                <input type="text" id="usernameInput" placeholder="输入用户名" onkeypress="handleAuthKeyPress(event)" style="width: 100%; background: #080a0f; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; color: #e2e8f0; font-size: 14px; box-sizing: border-box; outline: none;">
            </div>
            
            <div class="form-group" style="margin-bottom: 24px;">
                <label style="display: block; font-size: 11px; color: #5c6b73; font-family: monospace; letter-spacing: 1px; margin-bottom: 8px;">PASSCODE</label>
                <input type="password" id="passwordInput" placeholder="密码" onkeypress="handleAuthKeyPress(event)" style="width: 100%; background: #080a0f; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; color: #e2e8f0; font-size: 14px; box-sizing: border-box; outline: none;">
            </div>
            
            <button class="auth-btn" onclick="login()" style="width: 100%; background: #00e5ff; color: #000; border: none; border-radius: 6px; padding: 14px; font-weight: bold; font-size: 15px; cursor: pointer;">
                连接 (CONNECT)
            </button>
            
            <div id="authErrorMsg" style="margin-top: 16px; font-size: 12px; color: #ff4757; font-family: monospace; text-align: center; min-height: 18px;"></div>
        </div>
    </div>

    <!-- 登录成功后展示的主内容容器 -->
    <div class="container" id="mainContainer" style="display: none; width: 100%; max-width: 860px; padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 10px;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="currentUserTag" style="color: #00e5ff; font-family: monospace; font-size: 13px; font-weight: bold;"></div>
                <span id="realTimeClock" style="color: #718096; font-family: monospace; font-size: 12px;"></span>
            </div>
            <button onclick="logout()" style="background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">[ 断开连接 ]</button>
        </div>
        <div class="results-section" id="resultsContainer"></div>
    </div>

    <!-- 弹窗组件 -->
    <div class="modal-overlay" id="notifyModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:10000;">
        <div class="modal-card" style="background:#161b22; border:1px solid #30363d; border-radius:12px; padding:20px; max-width:400px; color:#c9d1d9;">
            <div id="modalTitle" style="color:#58a6ff; font-weight:bold; margin-bottom:10px;"></div>
            <div id="modalText" style="font-family:monospace; font-size:13px; white-space:pre-wrap; line-height:1.6;"></div>
            <button onclick="closeModal()" style="margin-top:15px; width:100%; padding:10px; background:#21262d; border:1px solid #30363d; color:#58a6ff; border-radius:6px; cursor:pointer;">确认 (ACKNOWLEDGE)</button>
        </div>
    </div>

    <!-- 准确的脚本引用路径（增加了新文件 phone_simulator.js） -->
    <script src="js/database.js"></script>
    <script src="js/players.js"></script>
    <script src="js/handouts.js"></script>
    <script src="js/phone_simulator.js"></script> <!-- 👈 模拟手机模块 -->
    <script src="js/main.js"></script>
</body>
</html>
