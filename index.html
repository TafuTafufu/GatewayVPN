<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway VPN v2.4 - 极速隐私网络</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 模拟加密隧道解密跳转动画 -->
    <div class="loader-overlay" id="loaderOverlay">
        <div class="spinner"></div>
        <div id="loaderStatusText">正在解密数据流...</div>
    </div>

    <!-- 登录弹窗 -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <div class="auth-title">GATEWAY VPN ACCESS</div>
            <div class="subtitle">请输入硬件凭证或终端身份代号</div>
            <div class="form-group">
                <label>USERNAME / USER IDENTITY</label>
                <input type="text" id="usernameInput" placeholder="输入用户名">
            </div>
            <div class="form-group">
                <label>PASSCODE</label>
                <input type="password" id="passwordInput" placeholder="密码">
            </div>
            <button class="auth-btn" onclick="login()">连接 (CONNECT)</button>
            <div class="auth-hint" id="authErrorMsg">
                说明：终端将建立高密加密隧道。
            </div>
        </div>
    </div>

    <header>
        <div class="logo-area">
            <div class="logo-icon">▲</div>
            <div>
                <div class="title-text">Gateway VPN</div>
                <!-- realTimeClock 挂载区域 -->
                <div class="subtitle">v2.4.18-p2 [已加密] <span id="realTimeClock" style="margin-left: 10px; color: var(--accent-color);"></span></div>
            </div>
        </div>
        <div class="status-bar">
            <div class="user-tag" id="currentUserTag">身份: 尚未登录</div>
            <button class="tab-btn" onclick="openHistoryModal()">[搜索历史]</button>
            <button class="tab-btn" onclick="logout()">[切换身份]</button>
            <button class="tab-btn" onclick="openConsole()">[检视抓包]</button>
        </div>
    </header>

    <div class="container">
        <div class="search-card">
            <div class="search-box-wrapper">
                <input type="text" id="searchInput" placeholder="在全域分布式网络与加密节点中检索..." onkeypress="handleKeyPress(event)">
                <button class="search-btn" onclick="executeSearch()">全局检索</button>
            </div>
        </div>

        <div class="results-section" id="resultsContainer"></div>
    </div>

    <div class="watermark">SECURE TERMINAL // GATEWAY VPN HIGH-SPEED TUNNEL</div>

    <!-- 提示弹窗 -->
    <div class="modal-overlay" id="notifyModal">
        <div class="modal-card">
            <div class="modal-header">⚠️ [系统同步通信提示]</div>
            <div class="modal-body" id="modalText">通信收到...</div>
            <button class="modal-btn" onclick="closeModal()">确认并忽略 (ACKNOWLEDGE)</button>
        </div>
    </div>

    <!-- 搜索历史弹窗 -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal-card">
            <div class="modal-header">📜 [当前账号本地加密检索缓存/搜索历史]</div>
            <div class="modal-body">
                <div id="historyContainer">暂无检索历史。</div>
            </div>
            <button class="modal-btn danger" onclick="clearHistory()">🗑️ 清除历史记录</button>
            <button class="modal-btn" onclick="closeHistoryModal()">关闭历史记录</button>
        </div>
    </div>

    <!-- 固件抓包弹窗 -->
    <div class="modal-overlay" id="consoleModal">
        <div class="console-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px; border-bottom:1px solid #2d3748; padding-bottom:6px;">
                <span style="color:#00e5ff; font-weight:bold;">[固件抓包与底层电路报告]</span>
                <span style="cursor:pointer; color:#ff3366;" onclick="closeConsole()">[关闭 ESC]</span>
            </div>
            <div class="console-log" id="consoleLogText"></div>
        </div>
    </div>

    <!-- 脚本加载 -->
    <script src="database.js"></script>
    <script src="players.js"></script>
    <script src="notifications.js"></script>
    <script src="main.js"></script>
</body>
</html>
