<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway VPN v2.4 - 极速隐私网络</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --panel-bg: #151821;
            --border-color: #262b3a;
            --accent-color: #00e5ff;
            --accent-warn: #ffb700;
            --accent-danger: #ff3366;
            --text-main: #e2e8f0;
            --text-dim: #718096;
            --font-mono: "Fira Code", "Courier New", Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: filter 0.8s ease;
        }

        body.stage-1 { filter: hue-rotate(10deg); }
        body.stage-2 { filter: hue-rotate(35deg) contrast(1.08); }
        body.stage-3 {
            filter: hue-rotate(75deg) contrast(1.15);
            animation: subtle-pulse 4s infinite alternate;
        }

        @keyframes subtle-pulse {
            0% { filter: hue-rotate(75deg) contrast(1.15); }
            100% { filter: hue-rotate(120deg) contrast(1.25); }
        }

        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 6, 9, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .auth-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            font-family: var(--font-mono);
        }

        .auth-title {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            text-align: center;
            letter-spacing: 1px;
        }

        .auth-subtitle {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            background: #090a0d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.8rem 1rem;
            color: #fff;
            font-family: var(--font-mono);
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .auth-btn {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 0.9rem;
            font-weight: bold;
            font-family: var(--font-mono);
            cursor: pointer;
            margin-top: 0.5rem;
            transition: opacity 0.2s;
        }
