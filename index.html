<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ACCESS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 模拟解密动画 overlay -->
    <div class="loader-overlay" id="loaderOverlay">
        <div class="spinner"></div>
        <div id="loaderStatusText">正在解密数据流...</div>
    </div>

    <!-- 极简暗网/VPN 登录遮罩弹窗 -->
    <div class="auth-overlay" id="authOverlay" style="display: flex;">
        <div class="auth-card">
            <div class="auth-title">GATEWAY VPN ACCESS</div>
            <div class="subtitle">请输入硬件凭证或终端身份代号</div>
            <div class="form-group">
                <label>USERNAME / USER IDENTITY</label>
                <input type="text" id="usernameInput" placeholder="输入用户名" onkeypress="handleAuthKeyPress(event)">
            </div>
            <div class="form-group">
                <label>PASSCODE</label>
                <input type="password" id="passwordInput" placeholder="密码" onkeypress="handleAuthKeyPress(event)">
            </div>
            <button class="auth-btn" onclick="login()">连接 (CONNECT)</button>
            <div class="auth-hint" id="authErrorMsg" style="margin-top: 15px; text-align: center;">
                说明：终端将建立高密加密隧道。
            </div>
        </div>
    </div>

    <!-- 登录成功后的主控制台 Header -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
        <div class="logo-area" onclick="goHome()" style="cursor: pointer; display: flex; align-items: center; gap: 10px;">
            <div class="logo-icon">▲</div>
            <div>
                <div class="title-text" style="font-weight: bold;">Gateway VPN</div>
                <div class="subtitle" style="font-size: 12px; color: #718096;">v2.4.18-p2 [已加密] <span id="realTimeClock" style="margin-left: 10px; color: #00e5ff;"></span></div>
            </div>
        </div>
        <div class="status-bar" style="display: flex; gap: 10px; align-items: center;">
            <div class="user-tag" id="currentUserTag" style="color: #00e5ff; font-weight: bold;">身份: 尚未登录</div>
            <button class="tab-btn" onclick="logout()">[断开连接 / 切换身份]</button>
        </div>
    </header>

    <!-- 主展示区域（根据登录凭证不同渲染不同界面） -->
    <div class="container" style="max-width: 900px; margin: 20px auto; padding: 0 15px;">
        <div class="results-section" id="resultsContainer"></div>
    </div>

    <div class="watermark" style="position: fixed; bottom: 10px; right: 10px; opacity: 0.2; font-size: 11px;">SECURE TERMINAL // GATEWAY VPN HIGH-SPEED TUNNEL</div>

    <!-- 右侧 Handout 抽屉 -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
    <div class="side-drawer" id="sideDrawer">
        <div class="drawer-header">
            <span class="drawer-title" id="drawerTitle">CLASSIFIED FILE // 机密线索</span>
            <button class="drawer-close-btn" onclick="closeDrawer()">✕</button>
        </div>
        <div class="drawer-body">
            <div class="handout-image-wrapper">
                <img id="drawerImage" src="" alt="Handout Image" style="display: none;">
            </div>
            <div class="drawer-content" id="drawerContent"></div>
            <div class="drawer-footer-meta" id="drawerFooterMeta"></div>
        </div>
    </div>

    <!-- 引入 JS 脚本 -->
    <script src="js/database.js"></script>
    <script src="js/players.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/handouts.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
